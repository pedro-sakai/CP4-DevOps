
version: "3.8"

services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: TrocarSenhaForte@123
      MYSQL_DATABASE: db_565956
      MYSQL_USER: user_565956
      MYSQL_PASSWORD: TrocarSenhaForte@456
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/db_565956?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: user_565956
      SPRING_DATASOURCE_PASSWORD: TrocarSenhaForte@456
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
